[project]
name = "fieldscan-tht02"
version = "1.0.0"
description = "Offline Industrial FieldScan Copilot: USB UVC Camera + 2D PDF Manual + Liquid AI LFM3 (VL + Audio) + Three.js 60FPS Parametric CAD + AutoCAD DXF/STL Escalation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pymupdf>=1.24.13",
    "ezdxf>=1.3.4",
    "pydantic>=2.9.2",
    "huggingface-hub>=0.26.2",
    "piper-tts>=1.2.0",
    "pyserial>=3.5",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldscan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
